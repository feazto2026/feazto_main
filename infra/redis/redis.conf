# Redis 7 local configuration for the Codewild food platform.
# Mounted read-only at /usr/local/etc/redis/redis.conf (see docker-compose.yml).
# Redis is SUPPORTING STATE ONLY: cache / locks / idempotency / rate limits /
# OTP throttling / dispatch scratch. PostgreSQL via Supabase is the system of
# record — see docs/operations/backup.md. All Redis data is reconstructable.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: AOF for durability of short-lived coordination state + RDB snapshots.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 3600 1 300 100 60 10000
dir /data
dbfilename dump.rdb

# Memory: cap local usage; evict cache keys first, never block writes.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Key expiry hygiene for platform key patterns (see MASTER_PROMPT section 12):
#   rate-limit:user:{id} | otp:{phone} | idempotency:{op}:{key}
#   lock:order:{id} | lock:slot:{slot}:{date} | cache:vendor:{id} | cache:serviceability:{zone}:{addr}
# TTLs are set by the API at write time; these timeouts only bound slow clients.
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile ""

# Authentication: intentionally unset for local dev.
# For staging/prod, set requirepass via a secret and inject REDIS_URL with credentials.
# Example (DO NOT hardcode the password here):
#   requirepass <injected-via-REDIS_PASSWORD>
#   masterauth  <same-as-requirepass-if-replica>

# Disable dangerous commands in shared environments (uncomment per environment):
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# Hz / backlog tuning (defaults are fine locally)
hz 10
tcp-backlog 511
databases 16
