# nginx vhost for the Admin Web (Vite SPA) container.
# Referenced by infra/docker/admin.Dockerfile.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No caching for the entry document so deploys pick up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Hashed Vite assets can be cached aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback — client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Simple liveness probe used by `scripts/verify.sh` and compose healthcheck.
  location /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
